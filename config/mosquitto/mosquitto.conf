# Smart Classroom MQTT broker (Laptop 1 / server). Start from the PROJECT FOLDER:
#   mosquitto -c config/mosquitto/mosquitto.conf -v
# Security: no anonymous clients, one username per role (server / node), topic access list.
# Use on a trusted PRIVATE network only (Windows network profile "Private"); never forward port 1883 on a router.
listener 1883
allow_anonymous false
password_file config/mosquitto/passwd
acl_file config/mosquitto/acl
persistence false
connection_messages true
log_type error
log_type warning
log_type notice
log_type information
